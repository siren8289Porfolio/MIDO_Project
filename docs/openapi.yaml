openapi: 3.0.3
info:
  title: MIDO Verification API
  version: 1.0.0
  description: >
    Verification workflow backend for MIDO.
    Provides manual input, file upload, and work context summary APIs.

servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /api/verifications:
    get:
      summary: List verifications (LOB-free projection, paginated)
      operationId: listVerifications
      tags:
        - Verification
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [DRAFT, READY, RUNNING, DONE, FAILED]
          description: Filter by verification status
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Paginated list of verification summaries (code LOB excluded)
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/VerificationSummaryResponse'
                  totalElements:
                    type: integer
                    format: int64
                  totalPages:
                    type: integer
                  number:
                    type: integer
                  size:
                    type: integer

  /api/da/dashboard/daily-metrics:
    get:
      summary: Daily product metrics (M-001~M-004) from the mart_daily_product_metrics view
      operationId: getDailyDashboardMetrics
      tags:
        - Dashboard
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 30
            maximum: 180
          description: Number of trailing days to include
      responses:
        '200':
          description: Daily product metrics, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyProductMetricResponse'

  /api/verifications/manual:
    post:
      summary: Create verification data from manual input
      operationId: createManualVerification
      tags:
        - Verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualInputRequest'
      responses:
        '200':
          description: Verification created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'

  /api/verifications/{id}/upload:
    post:
      summary: Upload a file and attach it to existing verification
      operationId: uploadVerificationFile
      tags:
        - Verification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: VerificationData ID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Text-based source code file to upload
      responses:
        '200':
          description: File uploaded and code field updated

  /api/verifications/{id}/context:
    get:
      summary: Get summarized work context for a verification
      operationId: getVerificationContext
      tags:
        - Verification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: VerificationData ID
      responses:
        '200':
          description: Work context summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkContextResponse'

  /api/verifications/{id}/analyze:
    post:
      summary: Run AI risk analysis for a verification
      operationId: analyzeVerificationRisk
      tags:
        - Verification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: VerificationData ID
      responses:
        '200':
          description: Risk analysis result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskAnalyzeResponse'
        '404':
          description: Verification not found
        '502':
          description: External AI service failure

components:
  schemas:
    ManualInputRequest:
      type: object
      properties:
        inputType:
          type: string
          description: Input type (PASTE, FILE, COMMIT, PR)
          example: PASTE
        inputMethod:
          type: string
          description: More specific input method (e.g., TEXTAREA, FILE_UPLOAD)
          example: TEXTAREA
        repoUrl:
          type: string
          nullable: true
          description: Repository URL when using COMMIT or PR mode
          example: https://github.com/siren8289/MIDO
        commitHash:
          type: string
          nullable: true
          description: Commit hash when using COMMIT mode
          example: 0123456789abcdef
        prNumber:
          type: integer
          nullable: true
          description: Pull request number when using PR mode
          example: 12
        rawInput:
          type: string
          nullable: true
          description: Raw input text from the manual input step
        code:
          type: string
          nullable: true
          description: Parsed/normalized code content used for verification
      required:
        - inputType
        - inputMethod

    DailyProductMetricResponse:
      type: object
      description: One row of mart_daily_product_metrics
      properties:
        metricDate:
          type: string
          format: date
        verificationStartedCount:
          type: integer
        verificationDoneCount:
          type: integer
        decisionLogCount:
          type: integer
        fixDecisionCount:
          type: integer
        reworkCount:
          type: integer
        m001DecisionLogRate:
          type: number
          nullable: true
        m002AvgApprovalSeconds:
          type: number
          nullable: true
        m003ReworkRate:
          type: number
          nullable: true
        m004CompletionRate:
          type: number
          nullable: true
        m005AuditManualTimeReductionRate:
          type: number
          nullable: true
          description: Always null until audit events are collected (M-005 not yet measured)

    VerificationSummaryResponse:
      type: object
      description: Projection used by the list endpoint; never includes the code LOB.
      properties:
        id:
          type: string
          format: uuid
        inputType:
          type: string
        status:
          type: string
          enum: [DRAFT, READY, RUNNING, DONE, FAILED]
        createdAt:
          type: string
          format: date-time

    IdResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
        - id

    WorkContextResponse:
      type: object
      properties:
        repoUrl:
          type: string
          nullable: true
          description: Repository URL to display in summary
        commitHash:
          type: string
          nullable: true
          description: Commit hash to display in summary
        prNumber:
          type: integer
          nullable: true
          description: PR number to display in summary

    RiskItemResponse:
      type: object
      properties:
        id:
          type: string
        severity:
          type: string
        title:
          type: string
        description:
          type: string
        cveId:
          type: string
          nullable: true
        sourceUrl:
          type: string
          nullable: true

    RiskAnalyzeResponse:
      type: object
      properties:
        analysisRunId:
          type: string
          format: uuid
        outputStatus:
          type: string
        confidence:
          type: string
        recommendation:
          type: string
        explanation:
          type: string
          nullable: true
        risks:
          type: array
          items:
            $ref: '#/components/schemas/RiskItemResponse'
      required:
        - analysisRunId
        - risks
