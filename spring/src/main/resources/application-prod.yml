spring:
  application:
    name: mido-verification
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  devtools:
    livereload:
      enabled: false

server:
  port: 8080
  # 프론트/nginx 가 /mido/api/... 로 호출 → 컨텍스트 포함 경로와 일치
  servlet:
    context-path: /mido
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    com.mido.verification: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

mido:
  ai:
    base-url: ${MIDO_AI_BASE_URL:http://mido-ai:8090}
    connect-timeout: 3s
    read-timeout: 15s
